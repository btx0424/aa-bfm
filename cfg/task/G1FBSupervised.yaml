# @package task
name: G1FBSupervised
project: aa-bfm

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 2.0]

robot:
  name: g1_waist_unlocked
terrain: plane

# common
num_envs: 4096
# BFMCommand replaces this per environment with the sampled clip length.
max_episode_length: 1500

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.005

input:
  action:
    _target_: JointPosition
    action_scaling:
      .*hip_pitch.*: 0.548
      .*hip_roll.*: 0.351
      .*hip_yaw.*: 0.548
      .*knee.*: 0.351
      waist_yaw_joint: 0.541
      waist_roll_joint: 0.439
      waist_pitch_joint: 0.439
      .*ankle.*: 0.439
      .*shoulder.*: 0.346
      .*elbow_joint: 0.173
      .*wrist_roll.*: 0.173
      .*wrist_pitch.*: 0.293
      .*wrist_yaw.*: 0.293
    max_delay: 1
    alpha_range: [1.0, 1.0]

command:
  _target_: BFMCommand
  lookahead: [1,2,3,4]
  reward_std: 0.5
  fall_xy_thres: 0.8
  ground_height: 0.4
  clip_regex: ["walk.*"]

observation:
  command:
    command: {key: keypoint}
  policy:
    root_angvel_b: {noise_std: 0.1}
    root_linvel_b: {}
    gravity_multistep: {steps: 1, noise_std: 0.05}
    joint_pos_multistep: {joint_names: ".*", steps: 4, noise_std: 0.01}
    joint_vel_multistep: {joint_names: ".*", steps: 4, noise_std: 0.5}
    prev_actions: {steps: 1}
  # One kinematic frame. Slice this group over time to build the SMP window.
  smp_:
    smp_state: {}
  # B reads this group as one vector. Joint position and velocity are in
  # simulation order. BFMCommand.ref_fb_state uses this same layout.
  fb_state:
    joint_pos: {joint_names: ".*"}
    joint_vel: {joint_names: ".*"}
    projected_gravity_b: {}
    root_angvel_b: {}
    root_linvel_b: {}
  # Reference lookahead in the fb_state layout. The FB update re-encodes this
  # with the current B. It is not an actor input.
  fb_prompt:
    fb_prompt: {}

reward:
  track:
    tracking_root_pos_exp: {weight: 1.0, std: 0.3}
    tracking_root_ori_exp: {weight: 1.0, std: 0.4}
    feet_position_error_exp:
      _target_: tracking_keypoint_pos_exp
      weight: 1.0
      std: 0.3
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
    knee_position_error_exp:
      _target_: tracking_keypoint_pos_exp
      weight: 1.0
      std: 0.3
      xy_only: true
      body_names: ["left_knee_link", "right_knee_link"]
    shoulder_position_error_exp:
      _target_: tracking_keypoint_pos_exp
      weight: 1.0
      std: 0.3
      body_names: ["left_shoulder_roll_link", "right_shoulder_roll_link"]
    elbow_position_error_exp:
      _target_: tracking_keypoint_pos_exp
      weight: 1.0
      std: 0.3
      body_names: ["left_elbow_link", "right_elbow_link"]
    wrist_position_error_exp:
      _target_: tracking_keypoint_pos_exp
      weight: 1.0
      std: 0.3
      body_names: ["left_wrist_yaw_link", "right_wrist_yaw_link"]
    feet_orientation_error_exp:
      _target_: tracking_keypoint_ori_exp
      weight: 1.0
      std: 0.4
      body_names: ["left_ankle_roll_link", "right_ankle_roll_link"]
    knee_orientation_error_exp:
      _target_: tracking_keypoint_ori_exp
      weight: 1.0
      std: 0.4
      body_names: ["left_knee_link", "right_knee_link"]
    elbow_orientation_error_exp:
      _target_: tracking_keypoint_ori_exp
      weight: 1.0
      std: 0.4
      body_names: ["left_elbow_link", "right_elbow_link"]
  reg:
    action_rate_l2:     {weight: 0.01}
    action_rate2_l2:    {weight: 0.002}
    joint_torques_l2: {weight: 1.0e-5}
    energy_l1:          {weight: 2.0e-4}
    joint_acc_l2:       {weight: 2.5e-7}
    feet_sliding:       {weight: 0.2, body_names: .*ankle_roll_link}

termination:
  max_episode_length: {}
  crash:
    body_names_expr:
      - "pelvis"
      - "torso_link"
      - ".*_hip_.*_link"
      - ".*shoulder_.*_link"
      - ".*(wrist|elbow).*"
  fall_over: {xy_thres: 0.8}

randomization:
  randomize_materials_isaac:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.6, 2.0]
    dynamic_friction_range: [0.6, 2.0]
    restitution_range: [0.0, 0.2]
    homogeneous: true
  actuator_pd_gains:
    stiffness_range:
      .*: [0.8, 1.1]
    damping_range:
      .*: [0.8, 1.1]
